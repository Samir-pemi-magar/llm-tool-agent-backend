services:
  sglang:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: sglang
    restart: unless-stopped
    ipc: host
    shm_size: "4gb"

    env_file:
      - sglang.env

    ports:
      - "3000:3000"

    command:
      - "--model-path"
      - "Qwen/Qwen3-1.7B"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "3000"
      - "--tool-call-parser"
      - "qwen"
      - "--reasoning-parser"
      - "qwen3"
      - "--disable-cuda-graph"
      - "--disable-piecewise-cuda-graph"
      - "--context-length"
      - "8192"
      - "--mem-fraction-static"
      - "0.85"
      - "--allow-auto-truncate"
      - "--attention-backend"
      - "triton"
      - "--watchdog-timeout"
      - "600"
      - "--disable-overlap-schedule"

    volumes:
      - sglang-model-cache:/root/.cache/huggingface

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')",
        ]

      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

  app:
    build:
      context: ./client
      dockerfile: Dockerfile

    container_name: sglang-app
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      SGLANG_URL: "http://sglang:3000"

      SANDBOX_DATA_DIR: "/app/data"

      FILE_SERVER_URL: "${FILE_SERVER_URL:-http://localhost:8000}"

      SANDBOX_HOST_DATA_DIR: "${PWD}/client/data"

      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      ALLOWED_EMAIL_RECIPIENTS: "${ALLOWED_EMAIL_RECIPIENTS:-}"
      EMAIL_CONTACTS: "${EMAIL_CONTACTS:-}"

    volumes:
      - ./client/data:/app/data

      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      sglang:
        condition: service_healthy

  open-webui:
    image: ghcr.io/open-webui/open-webui:main

    container_name: open-webui
    restart: unless-stopped

    ports:
      - "3001:8080"

    environment:
      OPENAI_API_BASE_URL: "http://app:8000/v1"

      OPENAI_API_KEY: "unused"

      WEBUI_AUTH: "true"

    volumes:
      - open-webui-data:/app/backend/data

    depends_on:
      - app

volumes:
  sglang-model-cache:

  open-webui-data:
