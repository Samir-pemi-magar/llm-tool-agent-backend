services:
  sglang:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: sglang
    restart: unless-stopped
    ipc: host
    env_file:
      - sglang.env
    ports:
      - "3000:3000"

    command:
      - "--model-path"
      - "Qwen/Qwen3-1.7B"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "3000"
      - "--tool-call-parser"
      - "qwen"
      - "--reasoning-parser"
      - "qwen3"
      - "--cuda-graph-backend-decode=disabled"
      - "--cuda-graph-backend-prefill=disabled"

    volumes:
      - sglang-model-cache:/root/.cache/huggingface

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

  app:
    build:
      context: ./client
      dockerfile: Dockerfile

    container_name: sglang-app
    restart: unless-stopped
    ports:
      - "8000:8000"

    environment:
      SGLANG_URL: "http://sglang:3000"

    volumes:
      - ./client/data:/app/data

    depends_on:
      sglang:
        condition: service_healthy

volumes:
  sglang-model-cache:
